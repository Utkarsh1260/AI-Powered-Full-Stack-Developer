<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Data Table</title>

    <style>
        table {
            width: 80%;
            border-collapse: collapse; 
            margin: 30px auto;
        }

        caption {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: lightgray;
        }

        tfoot {
            font-weight: bold;
        }
    </style>
</head>

<body>

    <table>

        <!-- Table Caption -->
        <caption>Student Data</caption>

        <!-- Column Grouping -->
        <colgroup>  <!--  colgroup lets you apply styling to multiple or entire column at once instead of applying styles to individual col/row -->
            <col span="2" style="background-color: rgb(230, 173, 173);">   <!-- here span ="2" means apply this column styles to first two columns of table that is name and age -->
            <col> 
          <col style="background-color: lightblue;">   <!--  this lightblue color is shifted to 4th column -->
            <col>
        </colgroup>

        <!-- Table Header -->
        <thead>
            <tr>
                <th>Name</th>
                <th>Age</th>
                <th>Course</th>
                <th>Marks</th>
            </tr>
        </thead>

        <!-- Main Table Data -->
        <tbody>
            <tr>
                <td>Anubhav</td>
                <td>24</td>
                <td>B.Tech CSE</td>
                <td>85</td>
            </tr>

            <tr>
                <td>Rahul</td>
                <td>23</td>
                <td>B.Tech IT</td>
                <td>78</td>
            </tr>

            <tr>
                <td>Priya</td>
                <td>22</td>
                <td>B.Tech CSE</td>
                <td>91</td>
            </tr>

            <tr>
                <td>Neha</td>
                <td>23</td>
                <td>B.Tech AI</td>
                <td>88</td>
            </tr>
        </tbody>

        <!-- Table Footer -->
        <tfoot>
            <tr>
                <td colspan="3">Average Marks</td>
                <td>85.5</td>
            </tr>
        </tfoot>

    </table>

</body>
</html>
