<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Fonts</title>

    <!-- Google Font: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>CSS Fonts</h1>

    <section class="font-container">

        <h2 class="font-family">
            Font Family
        </h2>

        <p class="font-size">
            This text demonstrates font size.
        </p>

        <p class="font-weight">
            This text demonstrates font weight.
        </p>

        <p class="font-style">
            This text demonstrates font style.
        </p>

        <p class="google-font">
            This text uses Google Font - Poppins.
        </p>

    </section>

</body>
</html>
