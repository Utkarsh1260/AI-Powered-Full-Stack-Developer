<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colors & Units</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>CSS Colors & Units</h1>

    <div class="color-box">
        <h2>CSS Color Types</h2>

        <p class="named-color">Named Color</p>
        <p class="hex-color">HEX Color</p>
        <p class="rgb-color">RGB Color</p>
        <p class="rgba-color">RGBA Color</p>
    </div>

    <div class="units-box">
        <h2>CSS Units</h2>

        <div class="px-box">Fixed Unit - 200px</div>
        <div class="percent-box">Relative Unit - 50%</div>
        <div class="em-box">Parent Based Unit - 2em</div>
        <div class="rem-box">Root Based Unit - 2rem</div>
    </div>

</body>
</html>
